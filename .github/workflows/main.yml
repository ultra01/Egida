name: Build Egida Driver

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # 官方镜像，windows-2025-vs2026 不存在
    env:
      SOLUTION: Egida.sln
      CONFIG: Release
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (WDK NuGet)
        run: msbuild ${{ env.SOLUTION }} /t:Restore /p:Configuration=${{ env.CONFIG }} /p:Platform=${{ env.PLATFORM }}

      - name: Build Driver Solution
        run: msbuild ${{ env.SOLUTION }} /p:Configuration=${{ env.CONFIG }} /p:Platform=${{ env.PLATFORM }}

      - name: Upload Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egida-driver
          path: |
            x64\Release\*.sys
            x64\Release\*.inf
