name: Build Egida Driver

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 移除 winget 安装 WDK 的步骤，改用 NuGet 还原
      # 如果你的项目没有 packages.config，这一步会依靠 vcxproj 中的 PackageReference 自动还原
      - name: Restore NuGet packages
        run: msbuild Egida.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build Solution
        shell: cmd
        run: |
          msbuild Egida.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egida-driver
          path: |
            x64\Release\*.sys
            x64\Release\*.inf
